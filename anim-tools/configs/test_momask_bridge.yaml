# Kiểm thử cầu nối MoMask -> AnimatedDrawings. Chạy từ repos/AnimatedDrawings.
scene:
  ANIMATED_CHARACTERS:
    - character_cfg: examples/characters/char1/char_cfg.yaml
      motion_cfg: ../../configs/momask_motion_template.yaml
      retarget_cfg: ../../configs/momask_retarget.yaml
view:
  USE_MESA: True
  CAMERA_POS: [0.1, 1.3, 2.7]
controller:
  MODE: video_render
  OUTPUT_VIDEO_PATH: ../../test-output/raw.mp4
  OUTPUT_VIDEO_CODEC: mp4v
